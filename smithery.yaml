# Smithery.ai MCP server configuration
# https://smithery.ai/docs/config

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      receiptMcpApiKey:
        type: string
        title: "Kelnix API Key"
        description: "Your Kelnix Receipt MCP API key. Register free at https://receipt-mcp-api.kelnix.org/docs — 50 credits included, no card required."
      anthropicApiKey:
        type: string
        title: "Anthropic API Key"
        description: "Anthropic API key for Claude AI vision. Only required if self-hosting the server."
    required: []
  commandFunction: |-
    (config) => ({
      command: "python",
      args: ["mcp_server.py"],
      env: {
        RECEIPT_MCP_API_KEY: config.receiptMcpApiKey || "",
        ANTHROPIC_API_KEY: config.anthropicApiKey || ""
      }
    })
